description: >
  M5Stack PaperS3 E-Ink display (ED047TC1 panel). The panel is driven directly over the board's
  dedicated parallel bus with a pixel state machine instead of waveform tables. All pins are
  hardcoded in the driver, so this node takes no pin properties.

compatible: "m5stack,papers3-display"

properties:
  rotation:
    type: int
    default: 0
    description: Fixed rotation in degrees (0, 90, 180 or 270), applied at start
