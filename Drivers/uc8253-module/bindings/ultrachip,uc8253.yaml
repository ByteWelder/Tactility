description: >
  Monochrome e-paper panels with a UC8253 controller, driven over SPI. The node must be a child
  of an SPI controller and shares its host, clock and MOSI pins. The driver manages the DC, RESET,
  BUSY and CS pins itself.

compatible: "ultrachip,uc8253"

bus: spi

properties:
  pin-dc:
    type: phandles
    required: true
    description: Data/Command GPIO pin
  pin-reset:
    type: phandles
    required: false
    default: GPIO_PIN_SPEC_NONE
    description: Reset GPIO pin
  pin-busy:
    type: phandles
    required: true
    description: Busy GPIO pin (low while busy)
  pin-cs:
    type: phandles
    required: true
    description: Chip-select GPIO pin
  clock-speed-hz:
    type: int
    default: 4000000
    description: SPI clock frequency in Hz (must be > 0)
  panel-type:
    type: text
    required: true
    description: Panel name. Supported values are "gdeq031t10".
