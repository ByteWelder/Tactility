description: FocalTech FT5x06 capacitive touch controller

include: ["i2c-device.yaml"]

compatible: "focaltech,ft5x06"

bus: i2c

properties:
  x-max:
    type: int
    required: true
    description: Maximum X coordinate reported by the controller (typically the panel's horizontal resolution)
  y-max:
    type: int
    required: true
    description: Maximum Y coordinate reported by the controller (typically the panel's vertical resolution)
  swap-xy:
    type: boolean
    default: false
    description: Swap the X and Y axes
  mirror-x:
    type: boolean
    default: false
    description: Mirror the X axis
  mirror-y:
    type: boolean
    default: false
    description: Mirror the Y axis
  pin-reset:
    type: phandles
    default: GPIO_PIN_SPEC_NONE
    description: Reset GPIO pin
  pin-interrupt:
    type: phandles
    default: GPIO_PIN_SPEC_NONE
    description: Interrupt GPIO pin
  disable-monitor-timeout:
    type: boolean
    default: false
    description: >
      Keep the controller out of monitor mode so it never NAKs a periodic I2C poll. Writes 0 to the
      FT5x06 monitor/sleep timeout register (0x87) and 0 (active) to the FT3168/FT5x06 power-mode
      register (0xA5). Some boards read the controller infrequently enough (e.g. apps that bypass
      LVGL's periodic read) that it otherwise sleeps and NAKs subsequent I2C reads.
